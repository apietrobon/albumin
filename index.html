<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive forest plots of randomised trials of intravenous albumin, by indication.">
<!--HEAD-->
<title>Albumin Evidence Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: masthead; left sidebar of indications and reference sections (a scrolling top bar on narrow screens); per indication a summary row (bubble grid | narrative + guidelines), then a filterable forest plot. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eef1f4;
  --ink: #141920;
  --ink-2: #49515e;
  --muted: #6c7482;
  --line: #dde2e8;
  --line-2: #c5ccd5;
  --accent: #1b5f66;
  --accent-ink: #ffffff;
  --accent-soft: #e2eff0;
  --fav: #2a78d6;
  --harm: #e34948;
  --ns: #8a909a;
  --rob-low: #0ca30c;
  --rob-some: #e0a000;
  --rob-high: #d03b3b;
  --rob-na: #b9bfc8;
  --shadow: 0 8px 28px rgba(20, 25, 32, .14);
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --ink: #eceef2; --ink-2: #b6bdc8;
    --muted: #8d95a2; --line: #2a3039; --line-2: #3a414c; --accent: #6cbcc3; --accent-ink: #0f1216;
    --accent-soft: #1d3236; --fav: #3987e5; --harm: #e66767; --ns: #858c97; --rob-na: #4a515c;
    --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --ink: #eceef2; --ink-2: #b6bdc8;
  --muted: #8d95a2; --line: #2a3039; --line-2: #3a414c; --accent: #6cbcc3; --accent-ink: #0f1216;
  --accent-soft: #1d3236; --fav: #3987e5; --harm: #e66767; --ns: #858c97; --rob-na: #4a515c;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); }
[hidden] { display: none !important; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 20px; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; } }

/* header */
.masthead { background: var(--surface); border-bottom: 1px solid var(--line); }
.masthead .wrap { padding-block: 22px 14px; display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; justify-content: space-between; }
.masthead h1 { font-size: 1.75rem; letter-spacing: -.01em; }
.masthead p { margin: 0; color: var(--ink-2); max-width: 70ch; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* sidebar navigation */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); max-width: 1600px; margin: 0 auto; align-items: start; }
.sidenav { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; padding: 22px 12px 28px 20px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid var(--line); min-height: calc(100vh - 90px); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup .eyebrow { padding: 0 10px 4px; font-size: .68rem; }
.navgroup + .navgroup { border-top: 1px solid var(--line-2); padding-top: 16px; }
.navlink { display: block; padding: 7px 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-weight: 500; line-height: 1.3; }
.navlink:hover { background: var(--surface-2); color: var(--ink); }
.navlink[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidenav { position: sticky; z-index: 20; flex-direction: row; gap: 18px; max-height: none; min-height: 0; overflow-x: auto; overflow-y: hidden; padding: 6px 16px 0; background: var(--surface); border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
  .navgroup { flex-direction: row; align-items: flex-end; flex: none; position: relative; padding-top: 16px; }
  .navgroup .eyebrow { position: absolute; top: 2px; left: 0; padding: 0 10px; }
  .navgroup + .navgroup { border-top: 0; border-left: 1px solid var(--line-2); padding-left: 10px; }
  .navgroup + .navgroup .eyebrow { left: 10px; }
  .navlink { white-space: nowrap; border-radius: 7px 7px 0 0; padding: 6px 10px 8px; }
}
main { min-width: 0; }
main .wrap { padding-block: 26px 60px; display: flex; flex-direction: column; gap: 28px; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.card-h h3 { margin: 0; }
.figbtns { display: inline-flex; align-items: center; gap: 6px; }
.figbtns .lbl { font-size: .74rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.btn.sm { height: 32px; padding: 0 10px; font-size: .84rem; gap: 6px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.forest-sec { display: flex; flex-direction: column; gap: 14px; }
.summary-row.one { grid-template-columns: minmax(0, 1fr); }
.view-head { display: flex; flex-direction: column; gap: 6px; }
.view-head h2 { font-size: 1.6rem; }
.view-head .sub { color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.section-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-title h3 { font-size: 1.2rem; }
.section-title .hint { color: var(--muted); font-size: .9rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.card h3 { font-size: 1.05rem; margin-bottom: 10px; }
.summary-row { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .summary-row { grid-template-columns: minmax(0, 1fr); } }
.side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.empty { color: var(--muted); font-style: italic; margin: 0; }
.prose p { margin: 0 0 .8em; max-width: 68ch; }
.prose p:last-child { margin-bottom: 0; }
.glist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.glist li { display: flex; flex-direction: column; gap: 3px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.glist li:last-child { border-bottom: 0; padding-bottom: 0; }
.glist .src { font-weight: 600; font-size: .9rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.pill { display: inline-block; font-size: .74rem; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

/* bubble grid */
.bubble-scroll { overflow-x: auto; }
.bubbles svg { display: block; }
.bubbles text { fill: var(--ink); font-family: var(--f-body); }
.bubbles .t2 { fill: var(--ink-2); }
.bubbles .t3 { fill: var(--muted); }
.bcell { cursor: pointer; }
.bcell:focus { outline: none; }
.bcell:focus-visible .hit, .bcell:hover .hit { stroke: var(--accent); stroke-width: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: .84rem; color: var(--ink-2); align-items: center; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { flex: none; }
.foot { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }

/* forest controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: .78rem; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
select, .btn { height: 40px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 0 12px; }
select { padding-right: 30px; min-width: 220px; max-width: 100%; }
.btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; flex: none; }
.spacer { flex: 1 1 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); font-size: .84rem; border: 1px solid transparent; }
.chip.warn { background: var(--surface-2); border-color: var(--line-2); }
.chip button { border: 0; background: transparent; cursor: pointer; width: 22px; height: 22px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); padding: 0; }
.chip button:hover { background: var(--line); color: var(--ink); }

/* filter popover */
.pop-anchor { position: relative; }
.popover { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: min(440px, calc(100vw - 32px)); max-height: min(70vh, 620px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); }
.pop-search { padding: 12px; border-bottom: 1px solid var(--line); }
.pop-search input { width: 100%; height: 38px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; background: var(--surface); }
.pop-body { overflow-y: auto; padding: 6px 0 10px; }
.pop-sec { padding: 8px 12px 4px; }
.pop-sec > .eyebrow { display: block; margin: 4px 0 6px; }
.pop-grp { margin: 2px 0 8px; }
.pop-grp-h { font-size: .8rem; font-weight: 600; color: var(--ink-2); margin: 6px 0 2px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.opt:hover { background: var(--surface-2); }
.opt input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
.opt .n { margin-left: auto; color: var(--muted); font-size: .8rem; }
.opt.sub { padding-left: 26px; }
.pop-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); justify-content: space-between; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px; font-weight: 500; }

/* forest table */
.forest { display: flex; flex-direction: column; gap: 22px; }
.fblock { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fblock-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.fblock-h h4 { margin: 0; font-size: 1rem; font-weight: 600; }
.fscroll { overflow-x: auto; }
table.ft { border-collapse: collapse; width: 100%; min-width: 1000px; font-size: .86rem; line-height: 1.3; }
.ft th { text-align: left; font-weight: 600; font-size: .74rem; color: var(--ink-2); padding: 6px 6px; line-height: 1.2; border-bottom: 1px solid var(--line); vertical-align: bottom; white-space: nowrap; }
.ft td { padding: 2px 6px; vertical-align: middle; }
.ft td.trunc { max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nowrap { white-space: nowrap; }
.ft tbody tr.trow > td { border-top: 1px solid var(--line); }
.ft tbody tr.trow:first-child > td { border-top: 0; }
.ft td.plot, .ft th.plot { padding: 0; position: relative; width: 240px; }
.ft td.plot .nl { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--line-2); }
.ft td.plot svg { display: block; position: relative; }
.ft .r { text-align: right; white-space: nowrap; }
.ft .est { white-space: nowrap; }
.study { display: flex; align-items: center; gap: 6px; }
.rtoggle { border: 0; background: none; padding: 0; width: 26px; height: 26px; cursor: pointer; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); flex: none; }
.rtoggle:hover { background: var(--surface-2); }
.rtoggle svg { transition: transform .15s; }
.rtoggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.sname { font-weight: 600; white-space: nowrap; }
.dim { color: var(--muted); }
.small { font-size: .8rem; }
tr.detail > td { background: var(--surface-2); padding: 12px 16px 14px 42px; border-top: 1px solid var(--line); }
.dl { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 6px 16px; margin: 0; max-width: 1000px; }
.dl dt { color: var(--ink-2); font-weight: 600; font-size: .82rem; }
.dl dd { margin: 0; font-size: .86rem; }
@media (max-width: 640px) { .dl { grid-template-columns: minmax(0, 1fr); } }
tr.pooled > td { border-top: 1px solid var(--line-2); background: var(--surface); padding-block: 8px; }
tr.pooled .lab { font-weight: 700; }
tr.het > td { padding: 2px 8px 10px 42px; color: var(--ink-2); font-size: .82rem; }
tr.axis > td { border-top: 1px solid var(--line); padding-block: 0 8px; }
.axis text { fill: var(--ink-2); font-size: 11px; font-family: var(--f-body); }
.flagline { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 1px 8px; border-radius: 99px; border: 1px dashed currentColor; }
.flagline.fragile { color: var(--ink-2); }
.robcell { display: flex; gap: 2px; }
.rob { width: 13px; height: 13px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; background: var(--rob-na); line-height: 1; }
.rob.low { background: var(--rob-low); }
.rob.some { background: var(--rob-some); color: #1a1a1a; }
.rob.high { background: var(--rob-high); }
.notes-list { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: .86rem; }
.notes-list li { margin-bottom: 2px; }

/* reference tables */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.toolbar input[type="search"] { height: 40px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; background: var(--surface); min-width: 260px; max-width: 100%; }
.tscroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table.rt { border-collapse: collapse; width: 100%; min-width: 980px; font-size: .88rem; }
.rt th { text-align: left; font-size: .76rem; color: var(--ink-2); font-weight: 600; padding: 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); white-space: nowrap; }
.rt td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.rt tr.detail > td { padding-left: 46px; }
.count { color: var(--muted); font-size: .88rem; }
.prose-wide { max-width: 78ch; }
.prose-wide h3 { font-size: 1.1rem; margin: 1.2em 0 .4em; }
.prose-wide p, .prose-wide li { color: var(--ink); }
.prose-wide ul { padding-left: 20px; }
footer { color: var(--muted); font-size: .82rem; border-top: 1px solid var(--line); }
footer .wrap { padding-block: 18px 30px; }

/* tooltip */
.tip { position: fixed; z-index: 50; pointer-events: none; max-width: 320px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px; font-size: .84rem; line-height: 1.4; }
.tip b { font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; }
.tip .row span:first-child { color: var(--ink-2); }
.rtoggle { width: 22px; height: 22px; }
.keyc { vertical-align: top; padding-top: 8px; }
.keys { display: inline-flex; gap: 14px; flex-wrap: wrap; }
.flagline { color: var(--ink-2); }
.robk { display: inline-flex; gap: 6px; align-items: center; }
.rt th.thwrap { white-space: normal; min-width: 96px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jumpbtn { cursor: pointer; padding: 5px 12px; font: inherit; font-size: .86rem; border: 1px solid transparent; }
.jumpbtn:hover { border-color: var(--accent); }
.sel-sec { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 70px; }
.sel-sec h3 { font-size: 1.12rem; }
.prisma { overflow-x: auto; }
details.about summary { cursor: pointer; font-weight: 600; font-family: var(--f-display); font-size: 1.05rem; }
details.about[open] summary { margin-bottom: 10px; }
.prisma svg { display: block; min-width: 560px; }
table.rt.compact, table.rt.steps { min-width: 640px; }
table.rt.steps td:first-child { white-space: nowrap; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
<!--BODY-->
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div>
      <div class="eyebrow">Randomised controlled trials of intravenous albumin</div>
      <h1>Albumin Evidence Dashboard</h1>

<div class="shell">

<main id="main"><div class="wrap" id="view"></div>
<footer><div class="wrap" id="foot"></div></footer></main>
</div>

entages. Albumin 5/56 = 8.9% (paper gives 9% and 10% in different places).","unit":null,"primary":"N","cum":"Yes"},"R0005":{"def":"Irreversible renal impairment: >50% rise in BUN or creatinine if pre-existing renal insufficiency (creatinine 1.5-3 mg/dL); otherwise BUN >30 mg/dL or creatinine >1.5 mg/dL","src":"Methods p.32 (Criteria of evaluation); Results p.33; Abstract","pop":"ITT","recheck":"Abstract and Results: deaths 5/56 vs 17/56; renal impairment 5 vs 19.","flag":"The paper calls it 'irreversible' renal impairment but does not state exactly when the post-treatment creatinine/BUN was taken, so the timing is approximate (end of 3-week treatment). Percentages in text (9%, 34%) are rounded from 8.9% and 33.9%.","notes":"Albumin 5/56 (9%) vs ceftriaxone 19/56 (34%), P=0.002. Counts verified in Results and Abstract. Creatinine and BUN were measured before and after treatment; the 3-week treatment period is the timepoint (3 weeks = Up to 30 days). Count is from enrolment, so cum = Yes. The paper gives no separate follow-up after the treatment period.","unit":null,"primary":"Y","cum":"Yes"},"R0006":{"def":"Renal failure: blood urea nitrogen >25 mg/dL or serum creatinine >1.5 mg/dL (one HES case described as acute renal failure with type 1 hepatorenal syndrome features)","src":"Results p.630 (text: 'No patient from group 1 developed ... renal failure ... 1 an acute renal failure'); Definitions p.629; Discussion p.633","pop":"ITT","recheck":"Results: no albumin patient vs 1 HES patient with acute renal failure.","flag":"The paper does not state exactly when renal failure was ascertained relative to the post-resolution visit; timing assumed to be the study period to infection resolution. No P value reported for renal failure. Pilot study (n=20): 0 vs 1 event is not interpretable.","notes":"Albumin 0/10 vs HES 1/10. Counts verified in the text (no renal failure in albumin group; one HES patient). Results give no table of renal failure events. Timing: infection resolved <script>/* Random-effects meta-analysis used by the dashboard (runs in the browser and in Node for validation).
   DerSimonian–Laird tau², Wald 95% CI, Hartung–Knapp 95% CI (t, k−1 df) when k ≥ 2,
   prediction interval (t, k−2 df) when k ≥ 3, plus Q, its p-value and I². */
var MA = (function () {
  var Z = 1.959963984540054;

  function logGamma(x) {
    var c = [76.18009172947146, -86.50532032941677, 24.01409824083091,
      -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
    var y = x, tmp = x + 5.5, ser = 1.000000000190015;
    tmp -= (x + 0.5) * Math.log(tmp);
    for (var j = 0; j < 6; j++) ser += c[j] / ++y;
    return -tmp + Math.log(2.5066282746310005 * ser / x);
  }
  // continued fraction for the regularized incomplete beta
  function betacf(a, b, x) {
    var MAXIT = 300, EPS = 3e-14, FPMIN = 1e-300;
    var qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < FPMIN) d = FPMIN;
    d = 1 / d; var h = d;
    for (var m = 1; m <= MAXIT; m++) {
      var m2 = 2 * m, aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d; var del = d * c; h *= del;
      if (Math.abs(del - 1) < EPS) break;
    }
    return h;
  }
  function ibeta(x, a, b) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var bt = Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
  }
  function tCdf(t, df) {
    var x = df / (df + t * t), p = 0.5 * ibeta(x, df / 2, 0.5);

    var lo = -1e3, hi = 1e3;

      if (tCdf(mid, df) < p) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  // regularized lower incomplete gamma P(a, x)
  function gammaP(a, x) {
    if (x <= 0) return 0;
    var gln = logGamma(a);

      var ap = a, sum = 1 / a, del = sum;
      for (var n = 0; n < 500; n++) { ap += 1; del *= x / ap; sum += del; if (Math.abs(del) < Math.abs(sum) * 3e-14) break; }
      return sum * Math.exp(-x + a * Math.log(x) - gln);
    }
    var b = x + 1 - a, c = 1e300, d = 1 / b, h = d;
    for (var i = 1; i < 500; i++) {
      var an = -i * (i - a); b += 2; d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300;
      c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300; d = 1 / d; var del2 = d * c; h *= del2;
      if (Math.abs(del2 - 1) < 3e-14) break;
    }
    return 1 - Math.exp(-x + a * Math.log(x) - gln) * h;
  }
  function chi2Sf(x, df) { return 1 - gammaP(df / 2, x / 2); }

  /* items: [{yi, se}] with finite yi and se > 0. Returns results on the analysis (log) scale. */
  function pool(items) {
    var k = items.length;
    if (k === 0) return null;
    if (k === 1) {
      var it = items[0];
      return { k: 1, mu: it.yi, se: it.se, lo: it.yi - Z * it.se, hi: it.yi + Z * it.se,
        tau2: null, Q: null, df: 0, pQ: null, I2: null, hkLo: null, hkHi: null, piLo: null, piHi: null, w: [100] };
    }

    for (var i = 0; i < k; i++) { sw += w[i]; swy += w[i] * items[i].yi; sw2 += w[i] * w[i]; }

    for (i = 0; i < k; i++) Q += w[i] * Math.pow(items[i].yi - yF, 2);
    var df = k - 1, C = sw - sw2 / sw;
    var tau2 = Math.max(0, (Q - df) / C);
    var ws = items.map(function (d) { return 1 / (d.se * d.se + tau2); });
    var sws = 0, swsy = 0;
    for (i = 0; i < k; i++) { sws += ws[i]; swsy += ws[i] * items[i].yi; }
    var mu = swsy / sws, se = Math.sqrt(1 / sws);
    var q = 0;
    for (i = 0; i < k; i++) q += ws[i] * Math.pow(items[i].yi - mu, 2);
    var seHK = Math.sqrt(q / (df * sws)), tq = tQuantile(0.975, df);
    var res = { k: k, mu: mu, se: se, lo: mu - Z * se, hi: mu + Z * se, tau2: tau2, Q: Q, df: df,
      pQ: chi2Sf(Q, df), I2: Q > 0 ? Math.max(0, (Q - df) / Q) * 100 : 0,
      hkLo: mu - tq * seHK, hkHi: mu + tq * seHK, piLo: null, piHi: null,
      w: ws.map(function (x) { return 100 * x / sws; }) };
    if (k >= 3) {
      var tp = tQuantile(0.975, k - 2), s = Math.sqrt(tau2 + se * se);
      res.piLo = mu - tp * s; res.piHi = mu + tp * s;
    }
    return res;
  }

  return { pool: pool, tQuantile: tQuantile, chi2Sf: chi2Sf, Z: Z };
})();

  // fig = {svg, w, h}; format "svg" | "png"
  function saveFigure(fig, base, format) {

    var img = new Image(), scale = 2;
    img.onload = function () {
      var c = document.createElement("canvas");
      c.width = Math.round(fig.w * scale); c.height = Math.round(fig.h * scale);
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { if (b) saveFile(base + ".png", b, "image/png"); }, "image/png");
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(fig.svg);
  }
  function figButtons(id) {
    return '<div class="figbtns" role="group" aria-label="Download figure"><span class="lbl">Figure</span>' +
      '<button class="btn sm" type="button" data-fig="' + id + '" data-fmt="png">' + icon("image") + "PNG</button>" +
      '<button class="btn sm" type="button" data-fig="' + id + '" data-fmt="svg">' + icon("down") + "SVG</button></div>";
  }
  function svgOpen(w, h, P, label) {

      (o.anchor ? ' text-anchor="' + o.anchor + '"' : "") + ' fill="' + (o.fill || "currentColor") + '"' + (o.extra || "") + ">" + esc(s) + "</text>";
  }

  /* ================= navigation & routing ================= */

  function currentSlug() {

  function route() {

  /* ================= indication view ================= */

  }

  function renderIndication(slug) {
    var ind = IND_BY[slug];
    var trials = indTrials(slug);
    var nPts = trials.reduce(function (s, t) { var mm = String(t.N || "").match(/\d+/), n = mm ? parseInt(mm[0], 10) : NaN; return s + (isFinite(n) ? n : 0); }, 0);
    var outs = indOutcomes(slug);
    var v = $("#view");

      (ind.plots ? "<span>" + trials.length + " randomised trials</span><span>" + int(nPts) + " patients randomised</span><span>" + outs.length + " outcomes</span>"
        : "<span>No randomised trial compared albumin with an albumin-free arm</span>") + "</div></div>";
    var side = '<div class="side">' + narrativeCard(slug) + guidelineCard(slug) + "</div>";

      '<div class="controls" id="controls"></div><div class="chips" id="chips"></div><div class="forest" id="forest"></div></section>';
    renderBubbles(slug, outs);

    each('#view .card-h [data-fig="bubbles"]', function (b) {

  function narrativeCard(slug) {

  function guidelineCard(slug) {

  /* ---------- bubble grid ---------- */
  function bubbleCell(slug, out, cat) {
    var rows = (byInd[slug] || []).filter(function (e) { return e.out === out && e.cat === cat && e.level === "all" && e.view === LONGEST; })
      .map(function (e) { return Object.assign({}, e); });
    if (!rows.length) return null;
    var p = poolRows(rows);
    var dir = rows[0].dir, m = rows[0].m;
    var st = status(p.r, dir);
    return { rows: rows, r: p.r, k: p.est.length, nTrials: rows.length, n: nPatients(rows), dir: dir, m: m, st: st, frag: fragility(p.r, st) };
  }
  function bubbleCells(slug, outs) {
    var cells = [], maxN = 1;
    CATS.forEach(function (cat, ci_) {
      outs.forEach(function (out, oi) {
        var c = bubbleCell(slug, out, cat);
        if (c) maxN = Math.max(maxN, c.n);
        cells.push({ cat: cat, out: out, ci: ci_, oi: oi, c: c });
      });
    });
    return { cells: cells, maxN: maxN };
  }
  function sizeKeys(maxN) {
    return uniq([Math.round(maxN / 10), Math.round(maxN / 2), maxN].map(function (n) { return n < 50 ? Math.max(1, Math.round(n)) : Math.round(n / 50) * 50; }));
  }
  // returns {svg, w, h, cells}; full = add title, legend and notes (for downloads)
  function bubbleSvg(slug, outs, P, full) {
    var bc = bubbleCells(slug, outs), cells = bc.cells, maxN = bc.maxN;
    var L0 = 178, CW = 118, RH = 104, OY = full ? 64 : 0, Y0 = 52 + OY, W = L0 + outs.length * CW + 14;
    var gridBottom = Y0 + CATS.length * RH + 4;
    var H = gridBottom;
    if (full) W = Math.max(W, 760);
    var rad = function (n) { return 5 + 27 * Math.sqrt(n / maxN); };
    var s = "";
    if (full) {
      s += T(0, 24, IND_BY[slug].title + ": evidence at a glance", { size: 16, weight: 600, fill: P.ink });
      s += T(0, 44, "Random-effects pooled estimate per comparison and outcome; each trial at its longest timepoint. Circle area = patients.", { size: 11.5, fill: P.ink2 });
    }
    outs.forEach(function (o, i) {
      var words = outLabel(o).split(" "), l1 = "", l2 = "";
      words.forEach(function (w) { if ((l1 + " " + w).trim().length <= 16 && !l2) l1 = (l1 + " " + w).trim(); else l2 = (l2 + " " + w).trim(); });
      var x = L0 + i * CW + CW / 2;
      s += T(x, OY + (l2 ? 18 : 32), l1, { size: 12.5, weight: 600, anchor: "middle", fill: P.ink });
      if (l2) s += T(x, OY + 34, l2, { size: 12.5, weight: 600, anchor: "middle", fill: P.ink });
    });
    CATS.forEach(function (cat, i) {
      var y = Y0 + i * RH;
      s += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="' + P.line + '"/>';
      s += T(0, y + RH / 2 - 6, CAT_SHORT[cat], { size: 13, weight: 600, fill: P.ink });
      s += T(0, y + RH / 2 + 10, CAT_NOTE[cat], { size: 11, fill: P.muted });
    });
    cells.forEach(function (cell, idx) {
      var cx = L0 + cell.oi * CW + CW / 2, cy = Y0 + cell.ci * RH + 40, c = cell.c;
      var label = esc(outLabel(cell.out) + ", " + CAT_SHORT[cell.cat]);
      if (!c) {
        s += '<g aria-label="' + label + ': not tested in any trial"><circle cx="' + cx + '" cy="' + cy + '" r="7" fill="none" stroke="' + P.line2 + '" stroke-dasharray="3 2"/>' +
          T(cx, cy + 46, "not tested", { size: 11, anchor: "middle", fill: P.muted }) + "</g>";
        return;
      }
      var r = rad(c.n), col = colorFor(c.st, P);
      var g = full ? "<g>" : '<g class="bcell" tabindex="0" role="button" data-i="' + idx + '" aria-label="' + label + '. Open in forest plot">' +
        '<rect class="hit" x="' + (cx - CW / 2 + 4) + '" y="' + (cy - 36) + '" width="' + (CW - 8) + '" height="' + (RH - 8) + '" rx="8" fill="transparent" stroke="transparent"/>';
      if (!c.r) {
        g += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + P.ns + '" stroke-dasharray="3 2"/>';
        g += T(cx, cy + 46, "no events", { size: 11.5, anchor: "middle", fill: P.ink2 });
      } else {
        var frag = c.frag, op = c.st === "ns" ? 0.45 : (frag ? 0.2 : 0.85);
        g += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r.toFixed(1) + '" fill="' + col + '" fill-opacity="' + op + '"' +
          (frag ? ' stroke="' + col + '" stroke-width="1.5" stroke-dasharray="3 2"' : ' stroke="' + P.bg + '" stroke-width="1.5"') + "/>";
        var mk = frag === "single" ? "†" : frag === "hk" ? "*" : "";
        g += T(cx, cy + 46, c.m + " " + f2(back(c.m, c.r.mu)) + mk, { size: 12, weight: 600, anchor: "middle", fill: P.ink });
      }
      g += T(cx, cy + 60, c.nTrials + " RCT" + (c.nTrials === 1 ? "" : "s") + " · " + int(c.n) + " pts", { size: 11, anchor: "middle", fill: P.ink2 });
      s += g + "</g>";
    });
    if (full) { // legend and notes drawn into the figure
      var y = gridBottom + 26, x = 0;
      var key = function (fill, op, dash, stroke, text) {
        var out = '<circle cx="' + (x + 7) + '" cy="' + (y - 4) + '" r="6.5" fill="' + fill + '" fill-opacity="' + op + '"' + (dash ? ' stroke="' + stroke + '" stroke-dasharray="2.5 2"' : "") + "/>" +
          T(x + 19, y, text, { size: 11.5, fill: P.ink2 });
        x += 26 + text.length * 6.1; return out;
      };
      s += key(P.fav, 0.85, false, "", "Favours albumin (95% CI excludes no effect)");
      s += key(P.fav, 0.2, true, P.fav, "Favours albumin, fragile");
      s += key(P.harm, 0.85, false, "", "Favours control");
      y += 22; x = 0;
      s += key(P.ns, 0.45, false, "", "No significant difference");
      s += key("none", 0, true, P.line2, "Not tested");
      var ks = sizeKeys(maxN), maxR = rad(ks[ks.length - 1]), yb = y + 18 + 2 * maxR, kx = 0;
      s += T(kx, yb - maxR + 4, "Circle area = patients:", { size: 11.5, fill: P.ink2 });
      kx += 140;
      ks.forEach(function (n) {
        var rr = rad(n);
        s += '<circle cx="' + (kx + rr) + '" cy="' + (yb - rr) + '" r="' + rr + '" fill="none" stroke="' + P.ink2 + '"/>' + T(kx + 2 * rr + 6, yb - rr + 4, int(n), { size: 11.5, fill: P.ink2 });
        kx += 2 * rr + 18 + String(int(n)).length * 7;
      });
      y = yb + 26;
      s += T(0, y, "* Significant by the standard random-effects (DerSimonian–Laird) CI but not by the Hartung–Knapp CI.  † Single trial.", { size: 10.5, fill: P.muted });
      s += T(0, y + 15, "All subcomparators combined within each comparison. Patients include trials with no events in either arm.", { size: 10.5, fill: P.muted });
      s += T(0, y + 30, "Albumin Evidence Dashboard, data " + M.built + ".", { size: 10.5, fill: P.muted });
      H = y + 42;
    }
    s = svgOpen(W, H, P, IND_BY[slug].title + ": pooled results by comparison and outcome") + s;
    return { svg: s + "</svg>", w: W, h: H, cells: cells, maxN: maxN, rad: rad };
  }

  function renderBubbles(slug, outs) {
    var b = bubbleSvg(slug, outs, PAGE, false), cells = b.cells;
    var svg = b.svg.replace(' width="' + b.w + '" height="' + b.h + '"', ' style="width:100%;max-width:' + b.w + "px;min-width:" + Math.round(b.w * 0.78) + 'px;height:auto"');
    var key = function (fill, op, dash, strokeCol) {
      return '<svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="' + fill + '" fill-opacity="' + op + '"' + (dash ? ' stroke="' + strokeCol + '" stroke-dasharray="2.5 2"' : "") + "/></svg>";
    };
    var sz = '<span class="k">Circle area = patients: ' + sizeKeys(b.maxN).map(function (n) {
      var rr = b.rad(n); return '<svg width="' + (rr * 2 + 2) + '" height="' + (rr * 2 + 2) + '" aria-hidden="true"><circle cx="' + (rr + 1) + '" cy="' + (rr + 1) + '" r="' + rr + '" fill="none" stroke="var(--ink-2)"/></svg><span class="num">' + int(n) + "</span>";
    }).join(" ") + "</span>";
    var html = '<div class="bubble-scroll">' + svg + "</div>" + '<div class="legend">' +
      '<span class="k">' + key("var(--fav)", 0.85) + "Favours albumin (95% CI excludes no effect)</span>" +
      '<span class="k">' + key("var(--fav)", 0.2, true, "var(--fav)") + "Favours albumin but fragile</span>" +
      '<span class="k">' + key("var(--harm)", 0.85) + "Favours control</span>" +
      '<span class="k">' + key("var(--ns)", 0.45) + "No significant difference</span>" +
      '<span class="k">' + key("none", 0, true, "var(--line-2)") + "Not tested</span>" + sz + "</div>" +
      '<p class="foot">Random-effects (DerSimonian–Laird) pooled estimate per cell, each trial at its longest timepoint, all subcomparators combined. ' +
      "* significant by the standard random-effects CI but not by the Hartung–Knapp CI. † single trial. Patients include trials with no events in either arm. Select a circle to open it in the forest plot.</p>";
    var host = $("#bubbles");
    host.innerHTML = html;
    each(".bcell", function (g) {
      var cell = cells[+g.dataset.i], c = cell.c;
      var tipHtml = function () {
        var h = "<b>" + esc(outLabel(cell.out)) + "</b><br>" + esc(CAT_LABEL[cell.cat]) + '<div style="height:6px"></div>';
        if (c.r) {
          h += '<div class="row"><span>' + MEASURE[c.m] + ' (95% CI)</span><span class="num">' + f2(back(c.m, c.r.mu)) + " (" + ci(back(c.m, c.r.lo), back(c.m, c.r.hi)) + ")</span></div>";
          if (c.r.k > 1) h += '<div class="row"><span>Hartung–Knapp CI</span><span class="num">' + ci(back(c.m, c.r.hkLo), back(c.m, c.r.hkHi)) + "</span></div>" +
            '<div class="row"><span>I²</span><span class="num">' + c.r.I2.toFixed(0) + "%</span></div>";
        }

          '<div class="row"><span>Patients</span><span class="num">' + int(c.n) + "</span></div>";
        if (c.frag === "hk") h += '<div style="margin-top:6px">Not robust to the Hartung–Knapp adjustment.</div>';
        if (c.frag === "single") h += '<div style="margin-top:6px">Single trial.</div>';

      g.addEventListener("mouseleave", hideTip);

      g.addEventListener("blur", hideTip);
      var go = function () {

      g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
    }, host);

  /* ---------- forest state ---------- */
  function outRows(slug, out) { return (byInd[slug] || []).filter(function (e) { return e.out === out; }); }
  function comboSort(a, b) {
    var A = a.split("|"), B = b.split("|");
    return CATS.indexOf(A[0]) - CATS.indexOf(B[0]) || subRank(A[1]) - subRank(B[1]);
  }
  function availableCombos(slug, out) {
    var keys = {};
    outRows(slug, out).forEach(function (e) { keys[e.cat + "|" + e.level] = true; });
    return Object.keys(keys).sort(comboSort);
  }
  function availableTps(slug, out) {
    return uniq(outRows(slug, out).map(function (e) { return e.view; })).sort(function (a, b) { return tpRank(a) - tpRank(b); });
  }
  function defaultCombos(slug, out) {
    var av = availableCombos(slug, out);
    if (av.indexOf("fluid|all") >= 0) return ["fluid|all"];
    for (var i = 0; i < CATS.length; i++) if (av.indexOf(CATS[i] + "|all") >= 0) return [CATS[i] + "|all"];
    return av.slice(0, 1);
  }
  function initState(slug, outs) {
    if (state[slug]) return;
    var out = outs.indexOf("Mortality") >= 0 ? "Mortality" : outs[0];
    state[slug] = { out: out, combos: defaultCombos(slug, out), tps: [LONGEST], daily: true, excluded: [] };
  }
  function resetForest(slug) { // default selection; the outcome stays as chosen
    var st = state[slug], at = availableTps(slug, st.out);
    st.combos = defaultCombos(slug, st.out);
    st.tps = [at.indexOf(LONGEST) >= 0 ? LONGEST : at[0]];
    st.daily = true; st.excluded = [];
  }
  function reconcile(slug) {
    var st = state[slug];
    var av = availableCombos(slug, st.out), at = availableTps(slug, st.out);
    st.combos = st.combos.filter(function (c) { return av.indexOf(c) >= 0; });
    if (!st.combos.length) st.combos = defaultCombos(slug, st.out);
    st.tps = st.tps.filter(function (t) { return at.indexOf(t) >= 0; });
    if (!st.tps.length) st.tps = [at.indexOf(LONGEST) >= 0 ? LONGEST : at[0]];
  }

  /* ---------- controls ---------- */
  var popOpen = null;

  }
  function selLabel(st) { var n = st.combos.length * st.tps.length; return icon("filter") + 'Edit selection <span class="dim">(' + n + " plot" + (n === 1 ? "" : "s") + ")</span>"; }
  function renderControls(slug) {
    var st = state[slug];
    reconcile(slug);
    var outs = indOutcomes(slug);
    var c = '<div class="field"><label for="out-sel">Outcome</label><select id="out-sel">' +
      outs.map(function (o) { return '<option value="' + esc(o) + '"' + (o === st.out ? " selected" : "") + ">" + esc(outLabel(o)) + "</option>"; }).join("") + "</select></div>" +
      '<div class="field pop-anchor"><span class="lbl" id="filter-lbl">Comparisons, timepoints and trials</span>' +
      '<div class="btnrow"><button class="btn" id="filter-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="pop">' + selLabel(st) + "</button>" +
      '<button class="btn" id="reset-btn" type="button" title="Longest timepoint, albumin vs all volume expanders, all trials">' + icon("reset") + "Reset to default</button></div>" +
      '<div class="popover" id="pop" hidden role="dialog" aria-labelledby="filter-lbl"></div></div>' +
      '<span class="spacer"></span>' +
      '<div class="field"><span class="lbl">Download what is shown</span><div class="btnrow">' +

      $("#tcount").textContent = rows.length + " of " + DATA.trials.length + " trials";
      $("#tbody").innerHTML = rows.map(function (t, i) {
        var id = "ta-" + i, extra = M.annCols.filter(function (c) { return ANN_SHOW.indexOf(c) < 0 && ANN_HIDE.indexOf(c) < 0 && t[c]; });
        return '<tr><td><button class="rtoggle" type="button" aria-expanded="false" aria-controls="' + id + '" aria-label="More about ' + esc(trialLabel(t.Trial)) + '">' + icon("chev") + "</button></td>" +
          "<td>" + esc(IND_BY[t._slug] ? IND_BY[t._slug].tab : t.Indication) + "</td>" +
          ANN_SHOW.map(function (c) { return "<td" + (c === "Trial" ? ' class="nowrap" style="font-weight:600"' : c === "N" ? ' class="num"' : "") + ">" + esc(c === "Trial" ? trialLabel(t[c]) : t[c]) + "</td>"; }).join("") + "</tr>" +
          '<tr class="detail" id="' + id + '" hidden><td colspan="' + (ANN_SHOW.length + 2) + '"><dl class="dl">' +
          extra.map(function (c) { return "<dt>" + esc(c) + "</dt><dd>" + esc(t[c]) + "</dd>"; }).join("") + "</dl></td></tr>";
      }).join("");
      each("#tbody .rtoggle", function (btn) {
        btn.addEventListener("click", function () {
          var d = document.getElementById(btn.getAttribute("aria-controls")), open = btn.getAttribute("aria-expanded") === "true";
          btn.setAttribute("aria-expanded", open ? "false" : "true"); d.hidden = open;
        });
      });
      return rows;
    };
    var shown = draw();
    $("#tq").addEventListener("input", function (ev) { trialsState.q = ev.target.value; shown = draw(); });
    $("#tind").addEventListener("change", function (ev) { trialsState.ind = ev.target.value; shown = draw(); });
    $("#dl-ann").addEventListener("click", function () {
      download("albumin_trial_annotations.csv", csv([M.annCols].concat(shown.map(function (t) { return M.annCols.map(function (c) { return t[c]; }); }))));
    });
  }

  /* ================= study quality ================= */
  function renderQuality() {
    var rated = Object.keys(DATA.rob).filter(function (k) { return DATA.rob[k].d.some(Boolean); }).length;
    var order = IND.map(function (i) { return i.slug; });
    var trials = DATA.trials.slice().sort(function (a, b) { return order.indexOf(a._slug) - order.indexOf(b._slug) || trialYear(a.Trial) - trialYear(b.Trial); });
    var legend = '<div class="legend"><span class="k"><span class="rob low">+</span>Low risk</span><span class="k"><span class="rob some">−</span>Some concerns</span>' +
      '<span class="k"><span class="rob high">×</span>High risk</span><span class="k"><span class="rob"></span>Not yet rated</span></div>';
    $("#view").innerHTML = '<div class="view-head"><div class="eyebrow">Reference</div><h2>Study quality</h2><div class="sub"><span>Risk of bias by trial (Cochrane RoB 2). ' +
      (rated ? rated + " of " + DATA.trials.length + " trials rated." : "Ratings have not been entered yet.") + " The same ratings appear beside each trial in the forest plots.</span></div></div>" + legend +
      '<div class="tscroll"><table class="rt"><thead><tr><th>Indication</th><th>Trial</th>' + ROB_DOMAINS.map(function (d) { return '<th class="thwrap">' + esc(d) + "</th>"; }).join("") + "<th>Sources</th><th>Notes</th></tr></thead><tbody>" +
      trials.map(function (t) {
        var rb = DATA.rob[t.Trial] || { d: [] };
        return "<tr><td>" + esc(IND_BY[t._slug] ? IND_BY[t._slug].tab : t.Indication) + '</td><td class="nowrap" style="font-weight:600">' + esc(trialLabel(t.Trial)) + "</td>" +
          ROB_DOMAINS.map(function (d, i) {
            var val = rb.d[i] || "", cls = robClass(val);
            return '<td><span class="k robk"><span class="rob ' + cls + '">' + robSym(cls) + '</span><span class="small' + (val ? "" : " dim") + '">' + esc(val || "Not rated") + "</span></span></td>";
          }).join("") + '<td class="small">' + esc(rb.src || "") + '</td><td class="small">' + esc(rb.notes || "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  /* ================= methods ================= */
  function renderMethods() {
    $("#view").innerHTML = '<div class="view-head"><div class="eyebrow">Reference</div><h2>Methods</h2></div><div class="card prose-wide">' +
      "<h3>Trials and comparisons</h3><p>Randomised controlled trials with an albumin arm and an albumin-free arm, grouped by clinical indication (see Study selection). Trials in which every arm received albumin (including all HRS-AKI trials) are not plotted. " +
      "Comparisons are never pooled across the three comparator categories: albumin against no albumin, against another volume expander, and against a vasoconstrictor. Within a category, each subcomparator is shown alone and all subcomparators are shown combined. In multi-arm trials, control arms at the same level are combined (events and N summed; means and SDs pooled) and albumin arms are combined before entry.</p>" +
      "<h3>Timepoints</h3><p>By default each trial contributes its longest usable timepoint, and the timepoint used is shown on every row (hover it for the wording in the paper). Each timepoint category can also be shown on its own. There is no all-timepoints view, because it would count the same patients twice. When several comparisons or timepoints are selected, each becomes its own plot with its own pooled estimate; they are never pooled together.</p>" +
      "<h3>Effect measures</h3><ul><li>Risk ratio for event outcomes. When any cell is zero, 0.5 is added to every cell. When both arms have no events the trial is shown as not estimable and is not pooled.</li>" +
      "<li>Ratio of means for urine output and natriuresis.</li><li>Mean difference for length of stay, ventilator-free days and RRT duration.</li>" +
      "<li>Medians with IQR or range were converted to mean and SD with the method of Wan et al. (2014). Crossover trials are analysed as parallel-group trials.</li></ul>" +
      "<h3>Pooling</h3><p>Random-effects meta-analysis (DerSimonian–Laird) on the log risk ratio, log ratio of means or mean difference, with variance SE². The diamond shows the standard random-effects 95% CI. " +
      "The Hartung–Knapp 95% CI (t distribution, k − 1 degrees of freedom) is shown with end caps when there are two or more trials. A result is marked <b>fragile</b> when the standard CI excludes no effect but the Hartung–Knapp CI does not, or when it rests on a single trial. " +
      "The 95% prediction interval (t distribution, k − 2 degrees of freedom, √(τ² + SE²)) is shown when there are three or more trials. τ², I² and Cochran's Q are reported for each pooled estimate. All pooling is recalculated in your browser when you change the selection.</p>" +
      "<h3>Direction</h3><p>Mortality, AKI, RRT, hyponatraemia, PICD, ascites recurrence, pulmonary oedema, serious adverse events and length of stay are harmful outcomes, so values below 1 (or below 0) favour albumin. Shock reversal, urine output, natriuresis and ventilator-free days are beneficial outcomes, so values above 1 (or above 0) favour albumin. Axis labels follow the outcome.</p>" +
      "<h3>Large-volume paracentesis</h3><p>Smart 1990, Fassio 1992, Altman 1998 and Zhao 2000 reached large volumes through repeated daily taps of 5 L or less. They are included by default and can be excluded in the forest plot filters.</p>" +
      "<h3>Data and figures</h3><p>Every forest plot can be downloaded as a figure (PNG or SVG), with the trial-level data, the random-effects weights and the source notes, and with the pooled calculations, for exactly the selection shown. Data current as of " + esc(M.built) + ".</p></div>";
  }

  /* ================= boot ================= */
  function boot() {
    var nTr = DATA.trials.length, nInd = IND.filter(function (i) { return i.plots; }).length;
    $("#mast-sub").textContent = nTr + " randomised trials across " + nInd + " indications. Interactive forest plots against no albumin, other volume expanders and vasoconstrictors.";
    $("#foot").textContent = "Data current as of " + M.built + ". Random-effects pooling is recalculated in the browser from per-trial effects. This dashboard summarises trial evidence for education and does not replace clinical judgement.";
    buildNav();
    window.addEventListener("hashchange", route);
    document.addEventListener("click", function (ev) { if (popOpen && !ev.target.closest(".pop-anchor")) closePopover(); });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && popOpen) { closePopover(); var b = $("#filter-btn"); if (b) b.focus(); } });
    window.addEventListener("scroll", hideTip, { passive: true });
    route();
  }
  boot();
})();
</script>
